[workspace]
resolver = "3"
members = [
  "code/rl",
  "code/rl-cli",
  "code/rl-daemon",
  "code/rl-session",
  "code/rl-core",
  "code/rl-detect",
  "code/rl-flow",
  "code/rl-ledger",
  "code/rl-proto",
]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/instilled/relay"

[workspace.dependencies]
rl-core = { path = "code/rl-core" }
rl-detect = { path = "code/rl-detect" }
rl-flow = { path = "code/rl-flow" }
rl-ledger = { path = "code/rl-ledger" }
rl-proto = { path = "code/rl-proto" }
rl-daemon = { path = "code/rl-daemon" }
rl-session = { path = "code/rl-session" }

anyhow = "1"
jiff = { version = "0.2", features = ["serde"] }
nix = { version = "0.31", features = ["process", "signal", "fs", "hostname", "term"] }
portable-pty = "0.9"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.30"
vt100 = "0.16"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: `rl setup` adds Relay's hooks to Codex's and Gemini's
# own JSON files (rl-detect's `user_hooks`) and writes them back with the
# user's keys in the order they were. Cargo unifies features, so this is
# workspace-wide: every crate's `serde_json::Map` keeps insertion order,
# ledger JSON and RPC output too.
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
unicode-width = "0.2"

# crossterm 0.29.0 with one change, in its unix key parser: a `CSI ?` sequence
# ends at its final byte rather than only at a `u` or a `c`. Without it a mode
# report a run asked the terminal for, answered after the panel took the
# terminal back, starts a sequence that never ends and every key after it goes
# into it — the panel draws on and hears nothing. Drop this when a crossterm
# release carries the fix.
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
