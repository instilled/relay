[workspace]
resolver = "3"
members = [
  "code/rl-cli",
  "code/rl-daemon",
  "code/rl-session",
  "code/shared-core",
  "code/shared-detect",
  "code/shared-ledger",
  "code/shared-proto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/instilled/relay"

[workspace.dependencies]
relay-core = { path = "code/shared-core" }
relay-detect = { path = "code/shared-detect" }
relay-ledger = { path = "code/shared-ledger" }
relay-proto = { path = "code/shared-proto" }
rl-daemon = { path = "code/rl-daemon" }
rl-session = { path = "code/rl-session" }

anyhow = "1"
jiff = { version = "0.2", features = ["serde"] }
nix = { version = "0.31", features = ["process", "signal", "fs", "hostname"] }
portable-pty = "0.9"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.30"
vt100 = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
