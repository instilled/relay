name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The install others run: scripts/install into a temp bin dir, then
      # rl --version and rl setup --check under a temp HOME and RELAY_HOME.
      - run: scripts/check-install
      # The release install: the debug build packed as a release, installed
      # from disk by the install.sh a release ships.
      - run: scripts/check-install-release
      - if: runner.os == 'Linux'
        run: shellcheck scripts/install scripts/check-install scripts/relay-dev scripts/ci scripts/screenshots scripts/package scripts/install-release scripts/check-install-release
