name: release

# Run by hand on main (`gh workflow run release`): names the release by the
# day (UTC) and the commit, 2026.11-17-a1b2c3d4e, builds rl and rl-session
# for macOS and Linux as that release (what `rl --version` says), and opens a
# draft release tagged so at that commit, with them, their sha256 and
# install.sh. Publish the draft by hand once it looks right. The
# same commit twice is the same release: the second run stops at its tag.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

concurrency:
  group: release

jobs:
  name:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.name.outputs.release }}
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - id: name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(date -u +%Y.%m-%d)
          tag="$day-${GITHUB_SHA:0:9}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is released already"; exit 1
          fi
          echo "release=$day" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  build:
    needs: name
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    env:
      RELAY_RELEASE: ${{ needs.name.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: scripts/package --target ${{ matrix.target }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.target }}
          path: dist/*

  release:
    needs: [name, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.name.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cp scripts/install-release dist/install.sh
      - run: |
          gh release create "$TAG" dist/* --draft --generate-notes \
            --target "$GITHUB_SHA" --title "$TAG"
