name: release

# Run by hand on main (`gh workflow run release`): names the release by the
# date and that day's count (2026.11-17-1, UTC), builds rl and rl-session
# for macOS and Linux as that release, and opens a draft release, tagged at
# the commit built, with them, their sha256 and install.sh. Publish the
# draft by hand once it looks right; `rl --version` says 2026.11-17-1#<sha9>.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

concurrency:
  group: release

jobs:
  name:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.name.outputs.release }}
    steps:
      - id: name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(date -u +%Y.%m-%d)
          # Today's releases, drafts too, and tags: the next count after them.
          n=$({
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate -q '.[].tag_name'
            gh api "repos/$GITHUB_REPOSITORY/tags" --paginate -q '.[].name'
          } | sed -n "s/^$day-\([0-9][0-9]*\)$/\1/p" | sort -n | tail -n 1)
          echo "release=$day-$(( ${n:-0} + 1 ))" >>"$GITHUB_OUTPUT"

  build:
    needs: name
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    env:
      RELAY_RELEASE: ${{ needs.name.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: scripts/package --target ${{ matrix.target }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.target }}
          path: dist/*

  release:
    needs: [name, build]
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ needs.name.outputs.release }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cp scripts/install-release dist/install.sh
      - run: |
          gh release create "$RELEASE" dist/* --draft --generate-notes \
            --target "$GITHUB_SHA" --title "$RELEASE (${GITHUB_SHA:0:9})"
