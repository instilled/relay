# Claude Code. Exact state comes from its hooks: `rl new` passes an extra
# settings file (--settings) so every session Relay holds reports back without
# touching the project's own .claude/settings.json. The patterns are only the
# fallback.
kind: agent
bins: [claude]
words: [claude]   # the list's command line starts it on this first word
prompt: ["{prompt}"]   # a first prompt goes last, on its own
icon: "✻"        # its rows in the panel; one column wide
color: "#d97757"    # #rrggbb; without one, the foreground
hooks:
  dialect: claude
  args: ["--settings", "{hooks_file}"]
# `{session}` is the conversation's own id (what hooks tell of); `{id}` below
# is the id `claude agents` lists a background session by. They differ.
resume: ["--resume", "{session}"]   # what carries a conversation on
patterns:
  needs_input:
    - '(?i)do you want to'
    - '(?i)allow .* for this session'
    - '(?i)esc to cancel'
    - '(?i)\(esc\)\s*$'
    - '^\s*❯?\s*\d+\.\s+(Yes|No)\b'
  idle:
    - '^\s*[│┃]\s*>\s*$'
    - '(?i)^\s*\? for shortcuts'
# Its own sessions, outside Relay (rl-detect/src/sessions.rs says how this
# block reads). What Claude's docs said on 2026-10-13 is beside each value.
sessions:
  hooks:
    # $CLAUDE_CONFIG_DIR, else ~/.claude. The first whose variables are all
    # set wins; `~` is $HOME.
    file: ["$CLAUDE_CONFIG_DIR/settings.json", "~/.claude/settings.json"]
    # The shape of Relay's per-run settings, `timeout` in seconds.
    timeout: 5s
    unit: s
    # The Claude sessions Relay holds have hooks of their own already
    # (--settings, above), which Claude runs beside these: this copy says
    # --user after its event, and is let go under a held session.
    marker: --user
    # Claude reads it as a session starts; one already open may ask you to
    # review the change in its /hooks screen.
    after_install: "Claude picks it up in sessions started from now on; ones already open may ask you to review it in /hooks"
    events:
      SessionStart: started
      UserPromptSubmit: { state: working, prompt: true }
      # The notifications that say how a session stands: it waits for your
      # approval, or for your next prompt.
      Notification:
        by: notification_type
        permission_prompt: { state: needs, waiting_for: "permission prompt" }
        idle_prompt: idle
      PostToolUse: carries-on
      Stop: idle
      SessionEnd: ended
  # What a hook cannot say: whether a session is in Claude's background, its
  # attach id, name, process and start. Uncertain: whether background
  # sessions (claude --bg) run user-level hooks at all, which is why the list
  # asks Claude while one is listed.
  # `--all`: without it, a background session that is done and has no process
  # left is not listed, though `claude agents` still shows it.
  list: { args: [agents, --json, --all], reader: claude-agents }
  # Enter on one in Claude's background opens it here.
  attach: [attach, "{id}"]
  # A new one starts in Claude's background (it prints its id and returns),
  # named if you name it; the prompt goes last. Carrying one on from another
  # terminal is `resume` above, then this: `claude --resume <id> --bg`.
  start: [--bg]
  name: [-n, "{name}"]
  # Stopping one still going (`claude stop <id>`): its process ends, its
  # conversation is kept, and `claude attach` opens it again.
  stop: [stop, "{id}"]
  # Removing one (^x twice, then `r`; /rm) deletes it for good: `claude rm
  # <id>`, which takes its worktree when that is safe and works on one that
  # has exited. Where it refuses (unpushed commits, a worktree it could not
  # remove) what it said is shown as said and the row stays: Relay never
  # passes --discard-unpushed or --force-remove-worktree. Read off `claude rm
  # --help` 2.1.322.
  remove: [rm, "{id}"]
  # No rename from outside: a name you give one in Relay's list is Relay's
  # till Relay next starts it or carries it on, which passes `name` above.
  # Relay mail wakes one idle in its background by `stop`, then `resume`
  # and `start` with the mail's line as the prompt; that is Claude's harness
  # code, from these words.
# Where Relay's MCP server goes (`rl setup`): Claude's own ~/.claude.json
# ($CLAUDE_CONFIG_DIR/.claude.json with that set), written only through
# `claude mcp add|remove --scope user`; Relay reads it to compare.
mcp:
  file: ["$CLAUDE_CONFIG_DIR/.claude.json", "~/.claude.json"]
# What `rl setup` sets in Claude's global config, the same file: `←` on an
# empty prompt opens Claude's agents view, and Relay's list is that view, so
# it is turned off: a plain key, as Relay reads no screen. Claude has no
# command that sets it (`claude config` is gone), so Relay writes the key
# itself, the rest of the file kept; `--check` says `check` while it is not
# so. `--remove` leaves it.
settings:
  file: ["$CLAUDE_CONFIG_DIR/.claude.json", "~/.claude.json"]
  set:
    # `short` and `why`: how the setup wizard names it, and its reason.
    - key: leftArrowOpensAgents
      value: false
      check: "← opens agents on"
      short: "← back to list"
      why: "← goes back to Relay's list"
