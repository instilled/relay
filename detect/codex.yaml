# OpenAI Codex CLI. Relay never holds a codex session: every thread runs in
# codex's own app-server daemon, which Relay lists and starts threads on
# (`sessions.list`). What codex's user-level hooks say (`rl setup` adds them to
# ~/.codex/hooks.json once you say yes, and you trust them once in codex's
# /hooks) fills in a thread the daemon no longer lists.
kind: agent
bins: [codex]
words: [codex]   # the list's command line starts it on this first word
prompt: ["{prompt}"]   # a first prompt goes last, on its own
icon: "⬡"        # its rows in the panel; one column wide
# `{session}` is the conversation's id; `{id}` (in `sessions`) is the id the
# daemon lists a thread by.
resume: ["resume", "{session}"]
patterns:
  needs_input:
    - '(?i)allow command\?'
    - '(?i)approve'
    - '(?i)\(y\)es'
  idle:
    - '^\s*[│┃]?\s*›\s*$'
# Its own sessions, outside Relay (rl-detect/src/sessions.rs says how this
# block reads). What codex's docs and source said on 2026-10-13 is beside
# each value (docs/plans/2026-10-13-agent-hooks-notes.md).
sessions:
  hooks:
    # $CODEX_HOME, else ~/.codex. The first whose variables are all set wins;
    # `~` is $HOME.
    file: ["$CODEX_HOME/hooks.json", "~/.codex/hooks.json"]
    # {"hooks": {"<Event>": [{"hooks": [{"type": "command", "command",
    # "timeout" (seconds), "async"}]}]}}. Codex waits this long; `rl hook` is
    # done well before.
    timeout: 3s
    unit: s
    # Codex runs it in its background, so it can never hold a turn up; never
    # the end's, which codex might not wait for as it exits (uncertain). So
    # hooks arrive out of order, several at once.
    async: true
    # A user-level hook runs only once trusted in codex's /hooks screen.
    # Uncertain: whether the codex installed (0.162) has hooks on by default
    # ([features] hooks), and whether SessionStart fires before the first
    # prompt.
    after_install: "codex asks you to trust it once: open codex, /hooks"
    events:
      SessionStart: started
      UserPromptSubmit: { state: working, prompt: true }
      PermissionRequest:
        state: needs
        waiting_for: "permission prompt"
        detail: tool_name
      PostToolUse: carries-on
      # A turn you interrupted.
      Interrupt: idle
      Stop: idle
      SessionEnd: ended
  # Its own sessions are the threads its shared app-server daemon has
  # loaded, and the threads Relay started there that it has since let go of
  # (at rest on disk). `codex app-server proxy` bridges the daemon's control
  # socket (a WebSocket, JSON-RPC inside) to stdio; Relay asks it for
  # `thread/loaded/list`, `thread/read` of each, and `thread/list`. No daemon
  # running: no sessions of its own.
  # A start is on the daemon too: `thread/start` in the folder, `turn/start`
  # with the prompt, and Relay lets go (no prompt: `codex` runs in the
  # terminal, and its TUI makes the thread). Stop interrupts a running turn.
  # Enter on one runs `attach` with its id, which opens it here through
  # the same daemon: the daemon rejoins a running thread (its
  # `thread/resume` says so), with any approval it waits on.
  list: { args: [app-server, proxy], reader: codex-threads }
  attach: [resume, "{id}"]
  # Mail Relay leaves for one of its sessions (`rl mcp`'s send) is queued on
  # its thread as well, and the thread resumed on the daemon, so it hears of
  # it: `{id}` is the thread's id, `{text}` the note. `codex queue --help`,
  # codex 0.167.
  ping: [queue, --thread, "{id}", --message, "{text}", --resume]
# Where Relay's MCP server goes (`rl setup`): `[mcp_servers.relay]` in
# Codex's config.toml, beside its hooks, with `env_vars` so a held
# session's variables reach the server.
mcp:
  file: ["$CODEX_HOME/config.toml", "~/.codex/config.toml"]
