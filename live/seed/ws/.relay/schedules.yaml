# A workspace's schedules. Nothing here fires until `rl up` approves this
# version; edit the file and it waits for approval again.
schedules:
  tick:
    every: 45s
    run: 'echo "tick in $(pwd)"; ls'
    tags: [live]

  standup:
    every: 5m
    run:
      agent: claude
      prompt_file: standup.md
    title: standup
    tags: [live, agent]
