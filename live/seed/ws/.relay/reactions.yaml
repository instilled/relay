# A workspace's reactions. Like its schedules, nothing here answers anything
# until `rl up` approves this version.
reactions:
  ask-about-failures:
    on: run.failed
    where: { tag: live }
    ask:
      title: "{title} failed"
      summary: "{summary}"
      options:
        - key: again
          label: Run it again
          run: "echo again >> retried.log"
        - key: ignore
          label: Ignore
          default: true
      expires: 2m
