# The global schedules of the live test home (~/.relay/schedules.yaml).
# `scripts/live reset` copies this to live/home/ and replaces @LIVE@ with the
# path of live/. Global schedules are trusted: they fire as soon as they load.
schedules:
  pulse:
    every: 30s
    run: [sh, -c, 'date +%T | tee -a pulse.log']
    cwd: "@LIVE@/ws"
    title: pulse
    tags: [live]

  slow:
    every: 3m
    run: [sh, -c, 'for i in 1 2 3 4 5 6; do echo "step $i of 6"; sleep 5; done']
    cwd: "@LIVE@/ws"
    title: six slow steps
    tags: [live, long]
    overlap: skip
