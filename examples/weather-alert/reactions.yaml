reactions:
  # A weather alert: ask whether to note it. `where.data` keeps this to the two
  # conditions the probe emits, and {data.*} fills the event's payload into the
  # question and the action it carries.
  weather-advisory:
    on: weather.alert
    where:
      data:
        condition: [sunny, rain-likely]
    ask:
      title: "{data.condition} in {data.place} today (rain {data.rain_pct}%) — add a note?"
      options:
        - key: note
          label: Add a note
          run: 'echo "{data.condition} in {data.place} (rain {data.rain_pct}%)" >> weather-notes.txt'
        - key: skip
          label: Skip
          default: true
      expires: 12h
